<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Fantasy Süper Lig{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">⚽ Fantasy Süper Lig</a>
    <nav class="nav">
      <a href="/players" {% if request.url.path == '/players' %}class="active"{% endif %}>Players</a>
      {% if current_user %}
        <span class="who">{{ current_user.display_name }}</span>
        <form method="post" action="/logout" class="inline">
          <button type="submit" class="linkish">Sign out</button>
        </form>
      {% else %}
        <a href="/login">Sign in</a>
        <a href="/register" class="btn small">Create account</a>
      {% endif %}
    </nav>
  </header>

  {% if flashes %}
  <div class="flashes">
    {% for f in flashes %}
      <div class="flash {{ f.level }}">{{ f.message }}</div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
