[project]
name = "fantasy-app"
version = "0.1.0"
description = "Fantasy football (Turkish Super Lig) - Yahoo-style draft league"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "alembic",
    "typer",
    "jinja2",
    "openpyxl",
    "python-multipart",
    "pydantic-settings",
    "argon2-cffi",
    "itsdangerous",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
fantasy = "app.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
